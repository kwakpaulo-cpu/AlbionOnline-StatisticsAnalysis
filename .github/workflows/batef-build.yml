name: "Bate F - build"

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - ".github/workflows/batef-build.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      Project_File_Path: src\StatisticsAnalysisTool\StatisticsAnalysisTool.csproj
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
          global-json-file: src/global.json

      - name: Publish
        shell: pwsh
        run: |
          dotnet publish $env:Project_File_Path `
            -c Release `
            -p:Platform=x64 `
            -p:PublishDir=bin\Release\publish\ `
            -p:TargetFramework=net10.0-windows10.0.19041.0 `
            -p:RuntimeIdentifier=win-x64 `
            -p:SelfContained=true `
            -p:PublishSingleFile=false `
            -p:PublishReadyToRun=false `
            -p:LocalInstallerBuild=true

      - name: Zip
        shell: pwsh
        run: |
          $pub = "src\StatisticsAnalysisTool\bin\Release\publish"
          Rename-Item -Path "$pub\StatisticsAnalysisTool.exe" -NewName "BateF.exe"
          Set-Content -Path "$pub\LEIA-ME-BATE-F.txt" -Value @"
          App Bate F - CHEGOU? CORRE!
          1. Extraia esta pasta onde quiser.
          2. Abra o BateF.exe (ele pede permissao de administrador, clique em Sim).
          3. Na primeira vez, clique em Entrar com Discord e faca o login no navegador.
          Pronto: a fama, a prata e o loot aparecem sozinhos no seu Tracker do Bate F Hub.
          "@
          Compress-Archive -Path "$pub\*" -DestinationPath BateF-windows-x64.zip
          Copy-Item BateF-windows-x64.zip StatisticsAnalysis-BateF-windows-x64.zip

      - name: Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view batef-latest *> $null
          if ($LASTEXITCODE -eq 0) { gh release delete batef-latest --cleanup-tag -y }
          gh release create batef-latest BateF-windows-x64.zip StatisticsAnalysis-BateF-windows-x64.zip --target $env:GITHUB_SHA --title "App Bate F" --notes "Versao da Bate F que envia o loot e as kills ao vivo para o Bate F Hub."
